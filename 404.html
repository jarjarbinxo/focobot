<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Focobot</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#071f18">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2325D366'/><text y='.9em' font-size='68' x='12'>🤖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#071f18;--accent:#25D366;--txt:#fff;--txt2:rgba(255,255,255,.65)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--txt);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100svh;text-align:center;padding:24px;overflow:hidden;
  background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(10,79,60,.5) 0%,transparent 70%),#071f18
}
.big{font-family:'Syne',sans-serif;font-size:clamp(7rem,20vw,14rem);font-weight:800;line-height:1;letter-spacing:-.06em;color:transparent;-webkit-text-stroke:2px rgba(37,211,102,.4);position:relative}
.big span{color:var(--accent);-webkit-text-stroke:0}
.emoji{font-size:clamp(3rem,8vw,5rem);margin:16px 0;animation:float 4s ease-in-out infinite}
h1{font-family:'Syne',sans-serif;font-size:clamp(1.5rem,4vw,2.2rem);font-weight:700;letter-spacing:-.04em;margin-bottom:12px}
p{font-size:1rem;color:var(--txt2);line-height:1.65;max-width:400px;margin:0 auto 32px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:50px;font-weight:600;font-size:.95rem;transition:all .22s;text-decoration:none}
.btn-p{background:var(--accent);color:#071f18;box-shadow:0 8px 32px rgba(37,211,102,.35)}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 12px 48px rgba(37,211,102,.5)}
.btn-o{border:1.5px solid rgba(37,211,102,.3);color:var(--txt)}
.btn-o:hover{background:rgba(37,211,102,.1);border-color:rgba(37,211,102,.6);transform:translateY(-2px)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.wrap{animation:fadeUp .7s ease forwards}
</style>
</head>
<body>
<div class="wrap">
  <div class="big">4<span>0</span>4</div>
  <div class="emoji">🤖</div>
  <h1>Oops — Even Our Bot Got Lost</h1>
  <p>This page doesn't exist. But your customers' WhatsApp messages do — and Focobot is ready to answer them 24/7.</p>
  <div class="actions">
    <a href="/" class="btn btn-p">← Back to Home</a>
    <a href="/#pricing" class="btn btn-o">View Plans</a>
  </div>
</div>
</body>
</html>
