<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found – Focobot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --hero-bg: #071f18;
      --accent: #25D366;
      --accent-dim: rgba(37,211,102,0.1);
      --text: #e8f5ee;
      --text-muted: #8aad9a;
    }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--hero-bg);
      color: var(--text);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 2rem;
      text-align: center;
      background: radial-gradient(ellipse 70% 60% at 50% 40%, #0e3d2c 0%, var(--hero-bg) 70%);
    }
    @keyframes floatY {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-14px); }
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(24px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .icon {
      font-size: 5rem;
      animation: floatY 4s ease-in-out infinite;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(3rem, 10vw, 7rem);
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
      animation: fadeUp .5s ease .1s both;
    }
    h2 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      font-weight: 700;
      color: #fff;
      margin: .8rem 0 .6rem;
      animation: fadeUp .5s ease .2s both;
    }
    p {
      font-size: 1rem; color: var(--text-muted);
      max-width: 420px; line-height: 1.65;
      animation: fadeUp .5s ease .3s both;
    }
    .actions {
      display: flex; flex-wrap: wrap; gap: .9rem; justify-content: center;
      margin-top: 2rem;
      animation: fadeUp .5s ease .4s both;
    }
    .btn-primary {
      display: inline-flex; align-items: center; gap: .5rem;
      background: var(--accent); color: #071f18;
      padding: .8rem 1.8rem; border-radius: 50px;
      font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: .97rem;
      text-decoration: none;
      transition: background .2s, transform .15s;
      box-shadow: 0 0 32px rgba(37,211,102,.3);
    }
    .btn-primary:hover { background: #4ae884; transform: translateY(-2px); }
    .btn-secondary {
      display: inline-flex; align-items: center; gap: .5rem;
      background: transparent; color: var(--text);
      padding: .8rem 1.8rem; border-radius: 50px;
      border: 1px solid rgba(255,255,255,.15);
      font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: .97rem;
      text-decoration: none;
      transition: border-color .2s, background .2s;
    }
    .btn-secondary:hover { border-color: var(--accent); background: var(--accent-dim); }
    .brand {
      position: fixed; top: 1.5rem; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: .5rem;
      font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.2rem; color: var(--accent);
      text-decoration: none;
    }
    .brand svg { width: 26px; height: 26px; }
  </style>
</head>
<body>
  <a href="/" class="brand">
    <svg viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="8" fill="#25D366"/><path d="M14 4C8.477 4 4 8.477 4 14c0 1.821.492 3.525 1.35 4.991L4.09 23.52a.5.5 0 0 0 .63.63l4.529-1.26A9.96 9.96 0 0 0 14 24c5.523 0 10-4.477 10-10S19.523 4 14 4Z" fill="#fff"/><path d="M10.5 13.5c.5 1.5 2 3 3.5 3.5" stroke="#25D366" stroke-width="1.5" stroke-linecap="round"/></svg>
    Focobot
  </a>
  <div class="icon">💬</div>
  <h1>404</h1>
  <h2>This page went offline</h2>
  <p>The page you're looking for doesn't exist — but your WhatsApp customers are still waiting. Let's get you back to growing your business.</p>
  <div class="actions">
    <a href="/" class="btn-primary">← Back to Focobot</a>
    <a href="/#cta" class="btn-secondary">Start Free Trial</a>
  </div>
</body>
</html>
