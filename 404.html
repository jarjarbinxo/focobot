<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Focobot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--bg:#071f18;--accent:#25D366;--accent-hi:#34eb78;--t1:#f0faf5;--t2:#8eb8a8;}
    html{scroll-behavior:smooth;}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;overflow:hidden;}
    ::selection{background:rgba(37,211,102,.22);}

    .bg-glow{
      position:fixed;inset:0;z-index:0;pointer-events:none;
      background:
        radial-gradient(ellipse 70% 50% at 50% 40%, rgba(37,211,102,.09) 0%, transparent 60%),
        var(--bg);
    }

    .card{
      position:relative;z-index:1;text-align:center;
      max-width:480px;
      animation:fadeUp .6s ease both;
    }

    .num{
      font-family:'Syne',sans-serif;font-size:clamp(6rem,18vw,9rem);
      font-weight:800;line-height:1;
      background:linear-gradient(130deg,var(--accent) 0%,#34eb78 50%,#1db954 100%);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      animation:breathe 3s ease-in-out infinite;
    }
    @keyframes breathe{0%,100%{filter:drop-shadow(0 0 20px rgba(37,211,102,.3));}50%{filter:drop-shadow(0 0 50px rgba(37,211,102,.6));}}

    .emoji{font-size:3rem;margin:1rem 0;display:block;}

    h1{font-family:'Syne',sans-serif;font-size:clamp(1.4rem,4vw,1.9rem);font-weight:800;margin-bottom:.75rem;}

    p{font-size:1rem;color:var(--t2);line-height:1.7;margin-bottom:2rem;}

    .btn{
      display:inline-flex;align-items:center;gap:.5rem;
      background:var(--accent);color:#071f18;
      padding:.85rem 2rem;border-radius:10px;
      font-weight:700;font-size:1rem;
      transition:background .2s,transform .2s,box-shadow .2s;
    }
    .btn:hover{background:var(--accent-hi);transform:translateY(-2px);box-shadow:0 8px 28px rgba(37,211,102,.33);}

    .hint{
      margin-top:1.5rem;font-size:.83rem;color:var(--t2);
    }
    .hint a{color:var(--accent);}

    @keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:none;}}
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="card">
    <div class="num">404</div>
    <span class="emoji">🤖</span>
    <h1>This Page Went Offline</h1>
    <p>Looks like this page isn't here — but your customers' messages are still waiting. Don't let them go unanswered.</p>
    <a href="/" class="btn">↩ Back to Focobot</a>
    <p class="hint">Or <a href="/#get-started">start your free trial →</a></p>
  </div>
</body>
</html>
