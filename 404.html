<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Focobot</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#071f18;--accent:#25D366;--text:#e4f0eb;--muted:#8bb8a4}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;overflow:hidden;-webkit-font-smoothing:antialiased}
h1,h2{font-family:'Syne',sans-serif}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes glow{0%,100%{opacity:.2;transform:scale(1)}50%{opacity:.55;transform:scale(1.1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(37,211,102,.4)}70%{box-shadow:0 0 0 14px transparent}100%{box-shadow:0 0 0 0 transparent}}
.orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;animation:glow 5s ease-in-out infinite}
.orb-a{width:480px;height:480px;background:rgba(37,211,102,.07);top:-180px;right:-100px}
.orb-b{width:320px;height:320px;background:rgba(10,79,60,.25);bottom:-100px;left:-80px;animation-delay:2.5s}
.icon-wrap{animation:float 6s ease-in-out infinite;margin-bottom:28px}
.icon-circle{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,rgba(37,211,102,.15),rgba(10,79,60,.35));border:2px solid rgba(37,211,102,.25);display:flex;align-items:center;justify-content:center;font-size:2.5rem;margin:0 auto}
.code{font-family:'Syne',sans-serif;font-size:6rem;font-weight:800;color:rgba(37,211,102,.15);line-height:1;margin-bottom:4px;animation:fadeUp .6s ease .05s both}
h2{font-size:clamp(1.6rem,3.5vw,2.4rem);font-weight:800;letter-spacing:-.025em;margin-bottom:14px;animation:fadeUp .6s ease .15s both}
p{color:var(--muted);font-size:1rem;line-height:1.7;max-width:440px;margin-bottom:36px;animation:fadeUp .6s ease .25s both}
.btn-home{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#071f18;padding:13px 30px;border-radius:9999px;font-weight:700;font-size:.95rem;text-decoration:none;transition:background .2s,transform .15s,box-shadow .2s;animation:fadeUp .6s ease .35s both,pulseRing 2.5s ease .8s infinite}
.btn-home:hover{background:#3fdf77;transform:translateY(-2px);box-shadow:0 12px 30px rgba(37,211,102,.35)}
.wa-hint{margin-top:20px;font-size:.82rem;color:var(--muted);animation:fadeUp .6s ease .45s both}
.wa-hint a{color:var(--accent);text-decoration:underline}
</style>
</head>
<body>
<div class="orb orb-a" aria-hidden="true"></div>
<div class="orb orb-b" aria-hidden="true"></div>
<div class="icon-wrap" aria-hidden="true">
  <div class="icon-circle">🤖</div>
</div>
<div class="code" aria-hidden="true">404</div>
<h2>This page doesn't exist</h2>
<p>Looks like this message went unanswered — just like WhatsApp messages without Focobot. Let's get you back on track.</p>
<a href="/" class="btn-home">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
  Back to Focobot
</a>
<p class="wa-hint">Need help? <a href="/">WhatsApp us directly →</a></p>
</body>
</html>
