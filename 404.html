<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Focobot</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#071f18;color:#fff;font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes glow{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:.72;transform:scale(1.16)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes drift{0%{opacity:0;transform:translate(0,0) scale(1)}6%{opacity:.85}82%{opacity:.3}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.25)}}
@keyframes ping{0%{transform:scale(.8);opacity:0}40%{opacity:.55}100%{transform:scale(2.8);opacity:0}}
@keyframes gridMove{from{background-position:0 0}to{background-position:60px 60px}}
@keyframes shimmer{0%{transform:translateX(-140%) skewX(-18deg)}100%{transform:translateX(360%) skewX(-18deg)}}
@keyframes borderPulse{0%,100%{border-color:rgba(37,211,102,.22);box-shadow:0 0 22px rgba(37,211,102,.06)}50%{border-color:rgba(37,211,102,.7);box-shadow:0 0 60px rgba(37,211,102,.24)}}

.bg-grid{position:fixed;inset:-80px;background-image:linear-gradient(rgba(37,211,102,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(37,211,102,.03) 1px,transparent 1px);background-size:60px 60px;animation:gridMove 30s linear infinite;pointer-events:none}
.parts{position:fixed;inset:0;pointer-events:none}
.p{position:absolute;border-radius:50%;background:#25D366;animation:drift linear infinite}
.gb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none}
.g1{width:460px;height:460px;background:rgba(37,211,102,.09);top:-100px;right:-80px;animation:glow 5.5s ease-in-out infinite}
.g2{width:340px;height:340px;background:rgba(10,79,60,.42);bottom:-80px;left:-60px;animation:glow 7s ease-in-out infinite 1.8s}

.card{position:relative;z-index:2;padding:52px 40px;max-width:520px;margin:0 16px;background:rgba(255,255,255,.03);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(37,211,102,.18);border-radius:28px;box-shadow:0 48px 120px rgba(0,0,0,.6);animation:borderPulse 5s ease-in-out infinite}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1.5px;background:linear-gradient(90deg,transparent,rgba(37,211,102,.7),transparent);border-radius:28px 28px 0 0}
.card::after{content:'';position:absolute;top:0;left:-60%;width:26%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);transform:skewX(-18deg);animation:shimmer 9s ease-in-out infinite;pointer-events:none}

.icon{font-size:72px;margin-bottom:20px;animation:float 5s ease-in-out infinite;display:block}
.num{font-family:'Syne',sans-serif;font-size:clamp(96px,22vw,136px);font-weight:800;background:linear-gradient(135deg,#25D366,#7dffb0 55%,#25D366);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:4px;animation:fadeUp .6s ease both .08s;letter-spacing:-4px}
h1{font-family:'Syne',sans-serif;font-size:clamp(22px,4.5vw,32px);font-weight:700;margin-bottom:14px;animation:fadeUp .6s ease both .18s;letter-spacing:-.3px}
p{font-size:16px;color:rgba(255,255,255,.52);margin-bottom:36px;line-height:1.74;animation:fadeUp .6s ease both .28s;max-width:380px;margin-left:auto;margin-right:auto}

.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;animation:fadeUp .6s ease both .38s}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:15px;padding:13px 28px;border-radius:11px;text-decoration:none;transition:all .22s;position:relative;overflow:hidden;border:none;cursor:pointer}
.btn::after{content:'';position:absolute;top:0;left:-130%;width:46%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);transform:skewX(-18deg);transition:left .48s ease}
.btn:hover::after{left:210%}
.btn-g{background:#25D366;color:#000;box-shadow:0 0 38px rgba(37,211,102,.42)}
.btn-g:hover{background:#1da851;transform:translateY(-2px);box-shadow:0 6px 64px rgba(37,211,102,.66)}
.btn-o{background:transparent;color:rgba(255,255,255,.7);border:1.5px solid rgba(255,255,255,.2)}
.btn-o:hover{border-color:#25D366;color:#25D366;background:rgba(37,211,102,.05)}

.bdot{width:6px;height:6px;border-radius:50%;background:#25D366;position:relative;flex-shrink:0}
.bdot::after{content:'';position:absolute;inset:-3px;border-radius:50%;background:rgba(37,211,102,.28);animation:ping 2.2s ease-out infinite}
.hint{margin-top:28px;font-size:12.5px;color:rgba(255,255,255,.26);animation:fadeUp .6s ease both .48s}
</style>
</head>
<body>

<div class="bg-grid" aria-hidden="true"></div>
<div class="parts" id="parts" aria-hidden="true"></div>
<div class="gb g1" aria-hidden="true"></div>
<div class="gb g2" aria-hidden="true"></div>

<div class="card">
  <span class="icon">💬</span>
  <div class="num">404</div>
  <h1>Page Not Found</h1>
  <p>This page doesn't exist — but your next sale is just one WhatsApp message away. Let Focobot capture it.</p>
  <div class="btns">
    <a href="/" class="btn btn-g"><span class="bdot"></span>Back to Focobot</a>
    <a href="/#signup" class="btn btn-o">Start Free Trial →</a>
  </div>
  <p class="hint">Every unanswered WhatsApp is lost revenue — Focobot fixes that.</p>
</div>

<script>
(()=>{
  const c=document.getElementById('parts');
  for(let i=0;i<28;i++){
    const p=document.createElement('div');p.className='p';
    const s=Math.random()*4+.7;
    p.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--dx:${((Math.random()-.5)*300).toFixed(0)}px;--dy:${((Math.random()-.5)*300).toFixed(0)}px;animation-duration:${(Math.random()*12+8).toFixed(1)}s;animation-delay:${(Math.random()*-24).toFixed(1)}s;opacity:${(Math.random()*.7+.1).toFixed(2)}`;
    c.appendChild(p);
  }
})();
</script>
</body>
</html>
