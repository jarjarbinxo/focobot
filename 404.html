<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Focobot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#071f18;--acc:#25D366;--txt2:rgba(255,255,255,.65)}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;position:relative;overflow:hidden}
body::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 30%,rgba(10,79,60,.5) 0%,transparent 70%);pointer-events:none}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 20px rgba(37,211,102,.2)}50%{box-shadow:0 0 60px rgba(37,211,102,.5)}}
.icon{font-size:72px;animation:float 3s ease-in-out infinite;display:block;margin-bottom:28px;position:relative;z-index:1}
.phone-frame{width:100px;height:100px;border-radius:24px;background:rgba(37,211,102,.1);border:2px solid rgba(37,211,102,.25);display:flex;align-items:center;justify-content:center;margin:0 auto 32px;animation:pulse 2.5s ease-in-out infinite;font-size:44px;position:relative;z-index:1}
h1{font-family:'Syne',sans-serif;font-size:clamp(28px,6vw,48px);font-weight:800;margin-bottom:14px;position:relative;z-index:1}
h1 span{color:var(--acc)}
p{font-size:17px;color:var(--txt2);max-width:400px;line-height:1.7;margin-bottom:36px;position:relative;z-index:1}
.btn{background:var(--acc);color:#071f18;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;padding:14px 32px;border-radius:100px;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:all .25s;box-shadow:0 8px 28px rgba(37,211,102,.3);position:relative;z-index:1}
.btn:hover{background:#20c55e;transform:translateY(-2px);box-shadow:0 16px 44px rgba(37,211,102,.5)}
.chat-bubble{background:#005c4b;border-radius:12px;border-top-right-radius:2px;padding:12px 18px;font-size:14px;color:#e9edef;margin:32px auto 0;max-width:280px;position:relative;z-index:1}
.chat-bubble::before{content:'Focobot 🤖';display:block;font-size:11px;color:var(--acc);font-weight:600;margin-bottom:4px}
</style>
</head>
<body>
<div class="phone-frame">💬</div>
<h1>This page went <span>offline</span></h1>
<p>Looks like this URL doesn't exist. But unlike a missed WhatsApp message, we can fix this one fast.</p>
<a href="/" class="btn">← Back to Focobot</a>
<div class="chat-bubble">No worries! The homepage is just one tap away. 🚀</div>
</body>
</html>
