<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Focobot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-deep: #071f18;
      --accent:  #25D366;
      --text-white: #f0faf4;
      --text-muted: #7aad95;
      --text-dim:   #4a7a63;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg-deep);
      color: var(--text-white);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; position: relative;
    }
    .bg-glow {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(37,211,102,.08) 0%, transparent 65%);
      pointer-events: none;
      animation: breathe 4s ease-in-out infinite;
    }
    @keyframes breathe { 0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(1)} 50%{opacity:1;transform:translate(-50%,-50%) scale(1.1)} }
    .wrap {
      text-align: center; padding: 24px; position: relative; z-index: 1;
      max-width: 520px;
    }
    .num-wrap {
      position: relative; display: inline-block; margin-bottom: 24px;
    }
    .num {
      font-family: 'Syne', sans-serif; font-size: clamp(100px, 20vw, 180px);
      font-weight: 800; line-height: 1;
      background: linear-gradient(135deg, #25D366 20%, #0a4f3c 80%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    .icon {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 70px; height: 70px; background: var(--bg-deep);
      border: 2px solid rgba(37,211,102,.3); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 30px;
    }
    h1 {
      font-family: 'Syne', sans-serif; font-size: clamp(22px, 4vw, 30px);
      font-weight: 800; margin-bottom: 14px;
    }
    p {
      font-size: 16px; color: var(--text-muted); line-height: 1.7;
      margin-bottom: 36px;
    }
    .actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .btn-primary {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--accent); color: #071f18;
      font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 15px;
      padding: 13px 26px; border-radius: 100px; border: none;
      text-decoration: none; transition: all .25s;
    }
    .btn-primary:hover { background: #2ee877; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(37,211,102,.3); }
    .btn-outline {
      display: inline-flex; align-items: center; gap: 8px;
      background: transparent; color: var(--text-white);
      font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 15px;
      padding: 12px 24px; border-radius: 100px;
      border: 1.5px solid rgba(255,255,255,.1);
      text-decoration: none; transition: all .25s;
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .hint {
      margin-top: 40px; font-size: 13px; color: var(--text-dim);
    }
    .hint a { color: var(--accent); text-decoration: none; }
    .hint a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="wrap">
    <div class="num-wrap">
      <div class="num">404</div>
      <div class="icon">💬</div>
    </div>
    <h1>This Page Went Offline</h1>
    <p>Unlike your WhatsApp with Focobot, this page doesn't exist. The link may be broken or the page may have been moved.</p>
    <div class="actions">
      <a href="/" class="btn-primary">← Back to Homepage</a>
      <a href="/#pricing" class="btn-outline">View Pricing</a>
    </div>
    <div class="hint">
      Need help? <a href="mailto:hello@focobot.com">hello@focobot.com</a> · Kuwait support available
    </div>
  </div>
</body>
</html>
