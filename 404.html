<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Focobot</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#071f18;--accent:#25D366;--accent-light:#4ade80;--text-muted:#8ab8a0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;-webkit-font-smoothing:antialiased;overflow:hidden;position:relative}
.orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none}
.orb1{width:520px;height:520px;background:rgba(37,211,102,.055);top:-140px;right:-90px;animation:drift 22s ease-in-out infinite}
.orb2{width:360px;height:360px;background:rgba(10,79,60,.18);bottom:-90px;left:-70px;animation:drift 30s ease-in-out infinite;animation-delay:-11s}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(28px,-18px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 24px rgba(37,211,102,.35)}50%{box-shadow:0 0 56px rgba(37,211,102,.65)}}
@keyframes shimmer{0%{background-position:200% center}100%{background-position:-200% center}}
.orb1,.orb2{display:block}
.content{position:relative;z-index:1}
.logo{display:inline-flex;align-items:center;gap:10px;font-family:'Syne',sans-serif;font-size:1.25rem;font-weight:800;text-decoration:none;color:#fff;margin-bottom:52px;animation:fadeUp .5s ease both}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),#19a348);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1rem;animation:glowPulse 3s ease-in-out infinite}
.bot{font-size:3.8rem;margin-bottom:14px;display:block;animation:floatY 3.5s ease-in-out infinite,fadeUp .5s .08s ease both;filter:drop-shadow(0 0 18px rgba(37,211,102,.28))}
.code{font-family:'Syne',sans-serif;font-size:clamp(5rem,18vw,9rem);font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent-light),var(--accent));background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:14px;animation:fadeUp .5s .12s ease both,shimmer 4s linear infinite}
h1{font-family:'Syne',sans-serif;font-size:clamp(1.4rem,4vw,2.1rem);font-weight:800;margin-bottom:10px;animation:fadeUp .5s .18s ease both}
p{font-size:.97rem;color:var(--text-muted);max-width:420px;line-height:1.72;margin-bottom:32px;animation:fadeUp .5s .24s ease both}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;animation:fadeUp .5s .3s ease both}
.btn-primary{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#000;font-weight:700;font-size:.95rem;padding:13px 26px;border-radius:50px;text-decoration:none;transition:transform .2s,box-shadow .2s}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 32px rgba(37,211,102,.38)}
.btn-secondary{display:inline-flex;align-items:center;gap:8px;background:transparent;color:#fff;font-weight:600;font-size:.95rem;padding:13px 26px;border-radius:50px;text-decoration:none;border:1px solid rgba(255,255,255,.12);transition:border-color .2s,background .2s}
.btn-secondary:hover{border-color:var(--accent);background:rgba(37,211,102,.07)}
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="content">
  <a class="logo" href="/">
    <div class="logo-icon">🤖</div>
    Focobot
  </a>
  <span class="bot">🤖</span>
  <div class="code">404</div>
  <h1>This Page Doesn't Exist</h1>
  <p>But your customers' WhatsApp messages do — and they're waiting for a reply right now. Let Focobot handle them in 2 seconds flat.</p>
  <div class="actions">
    <a class="btn-primary" href="/">Back to Home →</a>
    <a class="btn-secondary" href="/#pricing">See Pricing</a>
  </div>
</div>
</body>
</html>
