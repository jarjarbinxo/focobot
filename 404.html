<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Focobot</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#071f18;--accent:#25D366;--accent-light:#4ade80;--text-muted:#8ab8a0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;-webkit-font-smoothing:antialiased;overflow:hidden;position:relative}
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none}
.orb1{width:500px;height:500px;background:rgba(37,211,102,.06);top:-120px;right:-80px;animation:drift 20s ease-in-out infinite}
.orb2{width:350px;height:350px;background:rgba(10,79,60,.18);bottom:-80px;left:-60px;animation:drift 28s ease-in-out infinite;animation-delay:-10s}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-20px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 24px rgba(37,211,102,.4)}50%{box-shadow:0 0 56px rgba(37,211,102,.7)}}
@keyframes shimmer{0%{background-position:200% center}100%{background-position:-200% center}}
.content{position:relative;z-index:1}
.logo{display:inline-flex;align-items:center;gap:10px;font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:800;text-decoration:none;color:#fff;margin-bottom:56px;animation:fadeUp .5s ease both}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),#19a348);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1rem;animation:glowPulse 3s ease-in-out infinite}
.bot{font-size:4rem;margin-bottom:16px;display:block;animation:floatY 3.5s ease-in-out infinite,fadeUp .5s .1s ease both;filter:drop-shadow(0 0 20px rgba(37,211,102,.3))}
.code{font-family:'Syne',sans-serif;font-size:clamp(5rem,18vw,9rem);font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent-light),var(--accent));background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:16px;animation:fadeUp .5s .15s ease both,shimmer 4s linear infinite}
h1{font-family:'Syne',sans-serif;font-size:clamp(1.5rem,4vw,2.2rem);font-weight:800;margin-bottom:12px;animation:fadeUp .5s .2s ease both}
p{font-size:1rem;color:var(--text-muted);max-width:440px;line-height:1.7;margin-bottom:36px;animation:fadeUp .5s .25s ease both}
.actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;animation:fadeUp .5s .3s ease both}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:50px;font-weight:700;font-size:.9rem;text-decoration:none;transition:transform .2s,box-shadow .2s}
.btn-primary{background:var(--accent);color:#000}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(37,211,102,.4)}
.btn-outline{border:1px solid rgba(255,255,255,.15);color:#fff}
.btn-outline:hover{border-color:var(--accent);background:rgba(37,211,102,.07)}
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="content">
  <a class="logo" href="/">
    <div class="logo-icon">🤖</div>
    Focobot
  </a>
  <span class="bot">🤖</span>
  <div class="code">404</div>
  <h1>This page doesn't exist</h1>
  <p>Looks like you wandered somewhere Focobot hasn't automated yet. Let's get you back to closing WhatsApp sales.</p>
  <div class="actions">
    <a class="btn btn-primary" href="/">← Back to Home</a>
    <a class="btn btn-outline" href="/#pricing">See Pricing →</a>
  </div>
</div>
</body>
</html>
