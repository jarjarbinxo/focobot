<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | Focobot</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--dark:#071f18;--accent:#25D366;--text:#e4f2eb;--dim:#7eab97;--fh:'Syne',sans-serif;--fb:'DM Sans',sans-serif}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--fb);background:var(--dark);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;overflow:hidden;position:relative}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes glowOrb{0%,100%{transform:scale(1) translate(0,0)}50%{transform:scale(1.15) translate(20px,-15px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseRing{0%{transform:scale(.85);opacity:.7}70%{transform:scale(2.2);opacity:0}100%{opacity:0}}
.orb{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none}
.o1{width:600px;height:600px;background:radial-gradient(circle,rgba(10,79,60,.5) 0%,transparent 70%);top:-200px;left:-150px;animation:glowOrb 20s ease-in-out infinite}
.o2{width:400px;height:400px;background:radial-gradient(circle,rgba(37,211,102,.1) 0%,transparent 70%);bottom:-100px;right:-80px;animation:glowOrb 16s ease-in-out infinite reverse}
.icon-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;width:100px;height:100px;animation:float 4s ease-in-out infinite;margin-bottom:28px}
.icon-bg{position:absolute;inset:0;border-radius:50%;background:rgba(37,211,102,.1);border:2px solid rgba(37,211,102,.2)}
.icon-bg::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(37,211,102,.2);animation:pulseRing 2.5s ease-out infinite}
.icon-wrap svg{width:46px;height:46px;color:var(--accent);position:relative;z-index:1}
.code{font-family:var(--fh);font-size:clamp(6rem,16vw,10rem);font-weight:800;line-height:1;color:transparent;background:linear-gradient(135deg,rgba(37,211,102,.85) 0%,rgba(37,211,102,.3) 100%);-webkit-background-clip:text;background-clip:text;margin-bottom:8px;animation:fadeUp .6s ease both}
h1{font-family:var(--fh);font-size:clamp(1.4rem,3vw,2rem);font-weight:700;margin-bottom:12px;animation:fadeUp .6s ease .1s both}
p{color:var(--dim);max-width:400px;line-height:1.75;font-size:1rem;animation:fadeUp .6s ease .18s both}
.actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:32px;animation:fadeUp .6s ease .26s both}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:50px;font-family:var(--fb);font-size:.92rem;font-weight:600;cursor:pointer;border:none;transition:all .2s;text-decoration:none;white-space:nowrap}
.btn-p{background:var(--accent);color:#071f18;box-shadow:0 4px 24px rgba(37,211,102,.35)}
.btn-p:hover{background:#1fbd5a;transform:translateY(-2px);box-shadow:0 10px 40px rgba(37,211,102,.5)}
.btn-o{background:transparent;color:var(--text);border:1.5px solid rgba(255,255,255,.18)}
.btn-o:hover{border-color:var(--accent);color:var(--accent)}
.btn svg{width:16px;height:16px;flex-shrink:0}
</style>
</head>
<body>
<div class="orb o1"></div>
<div class="orb o2"></div>
<div class="icon-wrap">
  <div class="icon-bg"></div>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/></svg>
</div>
<div class="code">404</div>
<h1>Page Not Found</h1>
<p>This page doesn't exist — but your business's unanswered WhatsApps do. Let's fix that.</p>
<div class="actions">
  <a href="/" class="btn btn-p">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
    Back to Homepage
  </a>
  <a href="/#cta-banner" class="btn btn-o">Try Focobot Free →</a>
</div>
</body>
</html>
