<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Focobot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --dark:#071f18;--accent:#25D366;--text:#e8f0eb;--muted:#7a9988;
  --glass:rgba(255,255,255,.05);--border:rgba(255,255,255,.08)
}
html,body{height:100%}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--dark);color:var(--text);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;overflow:hidden;text-align:center;padding:24px
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 28px rgba(37,211,102,.2)}50%{box-shadow:0 0 60px rgba(37,211,102,.45)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

.bg{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 70% 60% at 50% 50%,rgba(10,79,60,.35) 0%,transparent 70%),
    radial-gradient(ellipse 40% 40% at 20% 20%,rgba(37,211,102,.04) 0%,transparent 60%)
}

.content{position:relative;z-index:1;max-width:520px}

.logo-wrap{
  display:inline-flex;align-items:center;gap:10px;
  font-family:'Syne',sans-serif;font-size:22px;font-weight:800;
  text-decoration:none;color:var(--text);margin-bottom:48px
}
.logo-ico{
  width:38px;height:38px;background:var(--accent);border-radius:11px;
  display:flex;align-items:center;justify-content:center;font-size:20px
}

.phone-404{
  width:96px;height:96px;border-radius:28px;
  background:var(--glass);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:44px;margin:0 auto 28px;
  animation:float 3.5s ease-in-out infinite, pulseGlow 3s ease-in-out infinite
}

.num{
  font-family:'Syne',sans-serif;font-size:96px;font-weight:800;line-height:1;
  background:linear-gradient(135deg,var(--accent) 0%,#5ee896 55%,#a8f5c2 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:16px;animation:fadeUp .5s ease both
}

h1{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;margin-bottom:12px;animation:fadeUp .5s ease .1s both}
p{font-size:16px;color:var(--muted);line-height:1.7;margin-bottom:36px;animation:fadeUp .5s ease .2s both}

.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;animation:fadeUp .5s ease .3s both}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:13px 26px;border-radius:12px;
  font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;
  text-decoration:none;transition:all .2s;border:none;cursor:pointer
}
.btn-p{background:var(--accent);color:#071f18}
.btn-p:hover{background:#20c05c;transform:translateY(-2px);box-shadow:0 10px 28px rgba(37,211,102,.35)}
.btn-g{background:var(--glass);color:var(--text);border:1px solid var(--border)}
.btn-g:hover{background:rgba(255,255,255,.08)}

.wa-note{
  margin-top:32px;font-size:13px;color:var(--muted);
  display:flex;align-items:center;justify-content:center;gap:8px;
  animation:fadeUp .5s ease .4s both
}
.wa-note a{color:var(--accent);text-decoration:none;font-weight:600}
.wa-note a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="bg"></div>
<div class="content">
  <a href="/" class="logo-wrap">
    <span class="logo-ico">💬</span>
    Focobot
  </a>
  <div class="phone-404">🔍</div>
  <div class="num">404</div>
  <h1>This Page Doesn't Exist</h1>
  <p>Looks like you found a dead link. But unlike an unanswered WhatsApp message, this one we can fix — head back home and let Focobot handle the rest.</p>
  <div class="btns">
    <a href="/" class="btn btn-p">← Back to Home</a>
    <a href="/#pricing" class="btn btn-g">Start Free Trial</a>
  </div>
  <div class="wa-note">
    Need help? <a href="https://wa.me/96500000000">Message us on WhatsApp →</a>
  </div>
</div>
</body>
</html>
