<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Focobot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #071f18; --accent: #25D366; --txt: #f0faf5; --txt-lo: #94b8a8;
      --border: rgba(37,211,102,.18);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg); color: var(--txt);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
    }
    @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-12px);} }
    @keyframes glow { 0%,100%{opacity:.3;} 50%{opacity:.7;} }
    .wrap { max-width: 540px; }
    .icon {
      font-size: 5rem; display: inline-block;
      animation: float 3s ease-in-out infinite;
      margin-bottom: 1.5rem; filter: drop-shadow(0 0 24px rgba(37,211,102,.4));
    }
    h1 {
      font-family: 'Syne', sans-serif; font-weight: 800;
      font-size: clamp(2rem, 5vw, 3rem); line-height: 1.1;
      margin-bottom: 1rem;
    }
    h1 em { color: var(--accent); font-style: normal; }
    p { color: var(--txt-lo); font-size: 1.05rem; line-height: 1.7; margin-bottom: 2rem; }
    .btn {
      display: inline-block; background: var(--accent); color: #fff;
      padding: .85rem 2rem; border-radius: 8px;
      font-weight: 600; font-size: 1rem; text-decoration: none;
      transition: background .2s, transform .15s;
      box-shadow: 0 4px 24px rgba(37,211,102,.3);
    }
    .btn:hover { background: #43e87d; transform: translateY(-2px); }
    .sub-link { display: block; margin-top: 1.25rem; color: var(--txt-lo); font-size: .9rem; }
    .sub-link a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="icon">&#128172;</div>
    <h1>This Page <em>Went Offline.</em><br/>Your Bot Didn't.</h1>
    <p>Looks like this page doesn't exist — but Focobot is still answering your customers' WhatsApp messages right now, 24/7, in Arabic and English.</p>
    <a href="/" class="btn">&#8592; Back to Focobot</a>
    <div class="sub-link">Or <a href="/#pricing">start your free trial</a> and automate your WhatsApp today.</div>
  </div>
</body>
</html>
