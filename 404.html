<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Focobot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#071f18;color:#fff;font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes glow{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:.7;transform:scale(1.15)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.gb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none}
.g1{width:360px;height:360px;background:rgba(37,211,102,.1);top:-80px;right:-60px;animation:glow 5s ease-in-out infinite}
.g2{width:280px;height:280px;background:rgba(10,79,60,.4);bottom:-60px;left:-40px;animation:glow 7s ease-in-out infinite 1.5s}
.inner{position:relative;z-index:2;padding:40px 24px;max-width:480px}
.emoji{font-size:72px;margin-bottom:24px;animation:float 4s ease-in-out infinite;display:block}
.num{font-family:'Syne',sans-serif;font-size:clamp(80px,15vw,120px);font-weight:800;color:#25D366;line-height:1;margin-bottom:8px;animation:fadeUp .6s ease both .1s}
h1{font-family:'Syne',sans-serif;font-size:clamp(22px,4vw,30px);font-weight:700;margin-bottom:14px;animation:fadeUp .6s ease both .2s}
p{font-size:16px;color:rgba(255,255,255,.6);margin-bottom:32px;line-height:1.65;animation:fadeUp .6s ease both .3s}
.btn{display:inline-flex;align-items:center;gap:8px;background:#25D366;color:#000;font-family:'DM Sans',sans-serif;font-weight:700;font-size:16px;padding:14px 28px;border-radius:10px;text-decoration:none;transition:all .2s;box-shadow:0 0 30px rgba(37,211,102,.35);animation:fadeUp .6s ease both .4s}
.btn:hover{background:#1da851;transform:translateY(-2px);box-shadow:0 0 50px rgba(37,211,102,.55)}
</style>
</head>
<body>
<div class="gb g1"></div>
<div class="gb g2"></div>
<div class="inner">
  <span class="emoji">💬</span>
  <div class="num">404</div>
  <h1>This page doesn't exist</h1>
  <p>Looks like you wandered off. The page you're looking for has moved, or never existed. Let's get you back on track.</p>
  <a href="/" class="btn">← Back to Focobot</a>
</div>
</body>
</html>
