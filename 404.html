<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Focobot</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#071f18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#071f18;--accent:#25D366;--fh:'Syne',sans-serif;--fb:'DM Sans',sans-serif}
html,body{height:100%}
body{background:var(--bg);color:#fff;font-family:var(--fb);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px;text-align:center;position:relative;overflow:hidden;-webkit-font-smoothing:antialiased;animation:pgIn .5s ease both}

@keyframes pgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-.3deg)}50%{transform:translateY(-14px) rotate(.3deg)}}
@keyframes glow{0%,100%{opacity:.18;transform:scale(1)}50%{opacity:.44;transform:scale(1.14)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes blink{0%,60%,100%{transform:translateY(0);opacity:.3}30%{transform:translateY(-5px);opacity:1}}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ping{0%{transform:scale(.7);opacity:0}40%{opacity:.5}100%{transform:scale(2.6);opacity:0}}
@keyframes borderPulse{0%,100%{border-color:rgba(37,211,102,.18);box-shadow:0 0 28px rgba(37,211,102,.04)}50%{border-color:rgba(37,211,102,.6);box-shadow:0 0 70px rgba(37,211,102,.18)}}
@keyframes drift{0%{opacity:0;transform:translate(0,0)}6%{opacity:.8}82%{opacity:.2}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
@keyframes waPulse{0%,100%{box-shadow:0 0 0 0 rgba(37,211,102,.56),0 8px 40px rgba(37,211,102,.38)}70%{box-shadow:0 0 0 18px rgba(37,211,102,0),0 8px 40px rgba(37,211,102,.18)}}

.bg-grid{position:fixed;inset:-80px;background-image:linear-gradient(rgba(37,211,102,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(37,211,102,.022) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
.parts{position:fixed;inset:0;pointer-events:none}
.p{position:absolute;border-radius:50%;background:#25D366;animation:drift linear infinite}
.gb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none}
.g1{width:460px;height:460px;background:rgba(37,211,102,.065);top:-120px;right:-80px;animation:glow 5.5s ease-in-out infinite}
.g2{width:360px;height:360px;background:rgba(10,79,60,.42);bottom:-80px;left:-60px;animation:glow 7.5s ease-in-out infinite 1.8s}

.card{position:relative;z-index:2;max-width:520px;width:100%;animation:fadeUp .6s ease both .1s}

.phone-mini{width:200px;height:auto;margin:0 auto 40px;background:#111b21;border-radius:32px;border:2px solid rgba(37,211,102,.2);overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.8),0 0 80px rgba(37,211,102,.06);animation:float 7s ease-in-out infinite;position:relative}
.phone-mini::after{content:'';position:absolute;inset:0;border-radius:32px;border:1px solid rgba(37,211,102,.07);animation:borderPulse 5s ease-in-out infinite;pointer-events:none}
.pm-bar{background:#202c33;padding:8px 14px 4px;display:flex;justify-content:space-between;font-size:9px;color:#fff;font-weight:700}
.pm-bar::before{content:'';display:block;width:44px;height:12px;background:#060c0f;border-radius:0 0 8px 8px;position:absolute;top:0;left:50%;transform:translateX(-50%)}
.pm-head{background:#202c33;padding:6px 10px;display:flex;align-items:center;gap:7px;border-bottom:1px solid rgba(255,255,255,.04)}
.pm-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#25D366,#0d6b51);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;position:relative}
.pm-av::after{content:'';position:absolute;bottom:0;right:0;width:8px;height:8px;background:#25D366;border-radius:50%;border:1.5px solid #202c33}
.pm-nm{color:#fff;font-size:10px;font-weight:600}
.pm-st{color:#25D366;font-size:8px}
.pm-body{background:#0b141a;padding:8px 7px;display:flex;flex-direction:column;gap:4px;min-height:100px}
.pm-msg{padding:5px 8px 3px;border-radius:6px;font-size:9px;color:#e9edef;line-height:1.5;max-width:86%}
.pm-bot{background:#202c33;align-self:flex-start;border-top-left-radius:2px;animation:msgIn .3s ease both}
.pm-usr{background:#005c4b;align-self:flex-end;border-top-right-radius:2px;animation:msgIn .3s ease both .6s}
.pm-bot2{animation-delay:.4s}
.pm-dots{align-self:flex-start;padding:7px 10px;background:#202c33;border-radius:6px;border-top-left-radius:2px;display:flex;gap:3px;align-items:center;animation:msgIn .3s ease both 1s}
.pm-d{width:4px;height:4px;background:rgba(255,255,255,.36);border-radius:50%;animation:blink 1.3s ease-in-out infinite}
.pm-d:nth-child(2){animation-delay:.25s}.pm-d:nth-child(3){animation-delay:.5s}

.err-code{font-family:var(--fh);font-size:clamp(64px,14vw,120px);font-weight:800;line-height:1;color:rgba(37,211,102,.14);letter-spacing:-4px;margin-bottom:8px;user-select:none}
.err-title{font-family:var(--fh);font-size:clamp(22px,5vw,34px);font-weight:800;margin-bottom:14px;color:#fff}
.err-sub{font-size:16px;color:rgba(255,255,255,.44);line-height:1.8;margin-bottom:40px;max-width:380px;margin-left:auto;margin-right:auto}
.err-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--fb);font-weight:700;font-size:15px;padding:14px 28px;border-radius:12px;text-decoration:none;border:none;cursor:pointer;transition:all .22s;white-space:nowrap}
.btn-g{background:#25D366;color:#000;box-shadow:0 0 36px rgba(37,211,102,.32)}
.btn-g:hover{background:#1da851;transform:translateY(-2px);box-shadow:0 8px 60px rgba(37,211,102,.6)}
.btn-o{background:transparent;color:rgba(255,255,255,.6);border:1.5px solid rgba(255,255,255,.14)}
.btn-o:hover{border-color:#25D366;color:#25D366}

.wa-fab{position:fixed;bottom:28px;right:28px;z-index:800;display:flex;align-items:center;gap:10px;background:#25D366;color:#000;font-weight:700;font-size:13px;padding:13px 20px 13px 16px;border-radius:100px;text-decoration:none;animation:waPulse 2.8s ease-in-out infinite;transition:transform .22s,background .22s}
.wa-fab:hover{background:#1da851;transform:translateY(-2px)}
</style>
</head>
<body>

<div class="bg-grid" aria-hidden="true"></div>
<div class="gb g1" aria-hidden="true"></div>
<div class="gb g2" aria-hidden="true"></div>
<div class="parts" id="parts" aria-hidden="true"></div>

<div class="card">
  <div class="phone-mini" aria-hidden="true">
    <div class="pm-bar"><span>9:41</span><span>●●●</span></div>
    <div class="pm-head">
      <div class="pm-av">🤖</div>
      <div><div class="pm-nm">Focobot</div><div class="pm-st">Online always</div></div>
    </div>
    <div class="pm-body">
      <div class="pm-msg pm-usr">Where did this page go? 🤔</div>
      <div class="pm-msg pm-bot">Hmm, I can't find that one!</div>
      <div class="pm-msg pm-bot pm-bot2">Let me take you back home 😊</div>
      <div class="pm-dots"><div class="pm-d"></div><div class="pm-d"></div><div class="pm-d"></div></div>
    </div>
  </div>

  <div class="err-code" aria-hidden="true">404</div>
  <h1 class="err-title">Page Not Found</h1>
  <p class="err-sub">This page doesn't exist — but your unanswered WhatsApp messages do. Let's fix both.</p>
  <div class="err-btns">
    <a href="/" class="btn btn-g">← Back to Focobot</a>
    <a href="/#signup" class="btn btn-o">💬 Start Free Trial</a>
  </div>
</div>

<a class="wa-fab" href="https://wa.me/96500000000" target="_blank" rel="noopener" aria-label="Chat with Focobot support on WhatsApp">
  💬 Need help?
</a>

<script>
(()=>{
  const c=document.getElementById('parts');if(!c)return;
  for(let i=0;i<24;i++){
    const p=document.createElement('div');p.className='p';
    const s=Math.random()*4+1.5;
    p.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--dx:${(Math.random()-.5)*160}px;--dy:${(Math.random()-.5)*160}px;opacity:${Math.random()*.6+.1};animation-duration:${Math.random()*8+5}s;animation-delay:${Math.random()*6}s`;
    c.appendChild(p);
  }
})();
</script>
</body>
</html>
