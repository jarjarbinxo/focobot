<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Focobot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'DM Sans',sans-serif;
  background:#071f18;
  color:#fff;
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;
  padding:40px 24px;
  -webkit-font-smoothing:antialiased;
}
.logo{
  display:flex;align-items:center;gap:10px;
  font-family:'Syne',sans-serif;
  font-size:1.4rem;font-weight:800;
  margin-bottom:48px;
  text-decoration:none;color:#fff;
}
.logo-icon{
  width:38px;height:38px;
  background:linear-gradient(135deg,#25D366,#19a348);
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;
  box-shadow:0 0 20px rgba(37,211,102,0.4);
}
.error-code{
  font-family:'Syne',sans-serif;
  font-size:clamp(6rem,18vw,10rem);
  font-weight:800;
  background:linear-gradient(135deg,#25D366,#4ade80);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  line-height:1;
  margin-bottom:16px;
}
h1{
  font-family:'Syne',sans-serif;
  font-size:clamp(1.4rem,3vw,2rem);
  font-weight:700;
  margin-bottom:16px;
}
p{
  font-size:1rem;color:#6b9e8a;
  max-width:360px;margin:0 auto 36px;
  line-height:1.7;
}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  background:#25D366;color:#071f18;
  font-family:'DM Sans',sans-serif;
  font-weight:700;font-size:1rem;
  padding:14px 28px;border-radius:50px;
  text-decoration:none;
  transition:all 0.2s;
  box-shadow:0 0 30px rgba(37,211,102,0.3);
}
.btn:hover{
  background:#1ebe57;
  box-shadow:0 0 50px rgba(37,211,102,0.5);
  transform:translateY(-2px);
}
</style>
</head>
<body>
<a href="/" class="logo"><div class="logo-icon">🤖</div>Focobot</a>
<div class="error-code">404</div>
<h1>This Page Went Offline</h1>
<p>Just like an unanswered WhatsApp, this page doesn't exist. Let's get you back to where things work.</p>
<a href="/" class="btn">🏠 Back to Focobot</a>
</body>
</html>
