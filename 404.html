<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Focobot</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#071f18;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;-webkit-font-smoothing:antialiased;overflow:hidden;position:relative}
.particles{position:fixed;inset:0;pointer-events:none;z-index:0}
.p{position:absolute;border-radius:50%;animation:particle linear infinite}
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none}
.orb1{width:400px;height:400px;background:rgba(37,211,102,.05);top:-100px;right:-80px;animation:orbDrift 18s ease-in-out infinite}
.orb2{width:300px;height:300px;background:rgba(10,79,60,.2);bottom:-60px;left:-60px;animation:orbDrift 22s ease-in-out infinite;animation-delay:-8s}
@keyframes particle{0%{transform:translateY(0) scale(1);opacity:.7}100%{transform:translateY(-110vh) scale(.1);opacity:0}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 24px rgba(37,211,102,.4)}50%{box-shadow:0 0 56px rgba(37,211,102,.7)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:200% center}100%{background-position:-200% center}}
@keyframes orbDrift{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-20px)}}
.content{position:relative;z-index:1}
.logo{display:flex;align-items:center;gap:10px;font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:800;margin-bottom:52px;text-decoration:none;color:#fff;justify-content:center;animation:fadeUp .5s ease both}
.logo-icon{width:38px;height:38px;background:linear-gradient(135deg,#25D366,#19a348);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;box-shadow:0 0 22px rgba(37,211,102,.4);animation:glowPulse 3s ease-in-out infinite}
.bot-float{font-size:4rem;margin-bottom:16px;animation:floatY 3.5s ease-in-out infinite,fadeUp .5s .1s ease both;display:block}
.error-code{font-family:'Syne',sans-serif;font-size:clamp(6rem,18vw,10rem);font-weight:800;background:linear-gradient(135deg,#25D366,#4ade80,#25D366);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:16px;animation:fadeUp .5s .15s ease both,shimmer 4s linear infinite}
h1{font-family:'Syne',sans-serif;font-size:clamp(1.4rem,3vw,2rem);font-weight:700;margin-bottom:16px;animation:fadeUp .5s .2s ease both}
p{font-size:1rem;color:#6b9e8a;max-width:380px;margin:0 auto 36px;line-height:1.72;animation:fadeUp .5s .25s ease both}
.btns{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;animation:fadeUp .5s .3s ease both}
.btn{display:inline-flex;align-items:center;gap:8px;background:#25D366;color:#071f18;font-family:'DM Sans',sans-serif;font-weight:700;font-size:1rem;padding:14px 28px;border-radius:50px;text-decoration:none;transition:all .22s;box-shadow:0 0 32px rgba(37,211,102,.3)}
.btn:hover{background:#1ebe57;box-shadow:0 0 56px rgba(37,211,102,.55);transform:translateY(-2px)}
.btn-sec{display:inline-flex;align-items:center;gap:8px;background:transparent;color:#fff;font-family:'DM Sans',sans-serif;font-weight:600;font-size:1rem;padding:14px 26px;border-radius:50px;border:1px solid rgba(255,255,255,.15);text-decoration:none;transition:all .22s}
.btn-sec:hover{border-color:#25D366;color:#25D366;background:rgba(37,211,102,.06)}
.status-note{margin-top:32px;font-size:.76rem;color:rgba(107,158,138,.6);animation:fadeUp .5s .4s ease both}
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="particles" id="particles"></div>
<div class="content">
  <a href="/" class="logo"><div class="logo-icon">🤖</div>Focobot</a>
  <span class="bot-float">🤔</span>
  <div class="error-code">404</div>
  <h1>This Page Went Offline</h1>
  <p>Just like an unanswered WhatsApp, this page doesn't exist. But your business never has to go silent — Focobot keeps you online 24/7.</p>
  <div class="btns">
    <a href="/" class="btn">🏠 Back to Focobot</a>
    <a href="https://wa.me/96599999999" class="btn-sec">💬 Chat with Us</a>
  </div>
  <div class="status-note">Focobot is live and replying instantly — your customers are never left waiting.</div>
</div>
<script>
(function(){
  var wrap=document.getElementById('particles');
  for(var i=0;i<22;i++){
    var p=document.createElement('div');p.className='p';
    var sz=Math.random()*4+1.5;
    p.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+(Math.random()*100)+'%;bottom:'+(Math.random()*30)+'%;background:rgba(37,211,102,'+(Math.random()*.45+.1).toFixed(2)+');animation-duration:'+(Math.random()*12+7)+'s;animation-delay:-'+(Math.random()*12)+'s;filter:blur('+(sz>3?1:0)+'px)';
    wrap.appendChild(p);
  }
})();
</script>
</body>
</html>
