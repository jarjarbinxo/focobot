<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Focobot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#071f18;--a:#25D366;--t:#e8f5f0;--m:#7aab96;
      --fh:'Syne',sans-serif;--fb:'DM Sans',sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{background:var(--bg);color:var(--t);font-family:var(--fb);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow-x:hidden;text-align:center;padding:24px}

    @keyframes glowPulse{0%,100%{box-shadow:0 0 20px rgba(37,211,102,.3),0 0 60px rgba(37,211,102,.08)}50%{box-shadow:0 0 48px rgba(37,211,102,.58),0 0 110px rgba(37,211,102,.18)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulseRing{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.8);opacity:0}}
    @keyframes bDot{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-7px)}}
    @keyframes msgPop{0%{opacity:0;transform:scale(.7) translateY(10px)}70%{transform:scale(1.04) translateY(-2px)}100%{opacity:1;transform:scale(1) translateY(0)}}

    .hgrid{position:fixed;inset:0;background-image:linear-gradient(rgba(37,211,102,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(37,211,102,.03) 1px,transparent 1px);background-size:58px 58px;z-index:0;pointer-events:none}
    .hbg{position:fixed;inset:0;background:radial-gradient(ellipse 90% 60% at 50% 0%,rgba(37,211,102,.09),transparent 65%);z-index:0;pointer-events:none}

    .wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:0}

    .phone-mini{animation:float 5s ease-in-out infinite;margin-bottom:32px}
    .ph{background:#161616;border-radius:28px;padding:10px;box-shadow:0 32px 80px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.07);width:190px;animation:glowPulse 3.5s ease-in-out infinite}
    .sc2{background:#0c1812;border-radius:20px;overflow:hidden}
    .ch4{background:#1b3a2e;padding:9px 11px;display:flex;align-items:center;gap:8px}
    .av4{width:28px;height:28px;background:linear-gradient(135deg,var(--a),#0d6b52);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
    .cn4{font-family:var(--fh);font-size:11px;font-weight:700;color:#fff}
    .st4{font-size:9px;color:var(--a)}
    .cb4{padding:10px 8px;min-height:130px;display:flex;flex-direction:column;gap:5px;background:#0c1812}
    .mm{max-width:85%;padding:6px 9px;border-radius:10px;font-size:10px;line-height:1.4}
    .rxm{background:#283830;color:#ddeae2;border-bottom-left-radius:2px;align-self:flex-start;animation:msgPop .4s cubic-bezier(.34,1.56,.64,1) .5s both}
    .txm{background:#1c5238;color:#d4f5bc;border-bottom-right-radius:2px;align-self:flex-end;animation:msgPop .4s cubic-bezier(.34,1.56,.64,1) 1.2s both}
    .txm2{animation-delay:2s}
    .typ4{background:#283830;border-radius:10px 10px 10px 2px;padding:7px 10px;display:flex;align-items:center;gap:4px;align-self:flex-start;width:42px;animation:msgPop .4s ease .9s both}
    .td4{width:5px;height:5px;background:var(--a);border-radius:50%;opacity:.75}
    .td4:nth-child(1){animation:bDot 1.2s ease-in-out infinite 0s}
    .td4:nth-child(2){animation:bDot 1.2s ease-in-out infinite .2s}
    .td4:nth-child(3){animation:bDot 1.2s ease-in-out infinite .4s}

    .big404{font-family:var(--fh);font-size:clamp(80px,15vw,140px);font-weight:800;line-height:1;color:transparent;-webkit-text-stroke:2px rgba(37,211,102,.25);margin-bottom:8px;animation:fadeUp .5s ease both}
    .err-title{font-family:var(--fh);font-size:clamp(22px,3.5vw,34px);font-weight:800;margin-bottom:14px;animation:fadeUp .5s ease .1s both}
    .err-sub{font-size:16px;color:var(--m);max-width:420px;line-height:1.7;margin-bottom:32px;animation:fadeUp .5s ease .2s both}

    .actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;animation:fadeUp .5s ease .3s both}
    .bp{display:inline-flex;align-items:center;gap:7px;background:var(--a);color:#071f18;font-family:var(--fb);font-size:15px;font-weight:600;padding:13px 26px;border-radius:100px;border:none;cursor:pointer;transition:transform .2s,box-shadow .2s;text-decoration:none;white-space:nowrap}
    .bp:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(37,211,102,.48);color:#071f18}
    .bs{display:inline-flex;align-items:center;gap:7px;background:transparent;color:var(--t);font-family:var(--fb);font-size:15px;font-weight:500;padding:13px 24px;border-radius:100px;border:1px solid rgba(255,255,255,.14);cursor:pointer;transition:all .2s;text-decoration:none}
    .bs:hover{border-color:rgba(37,211,102,.42);background:rgba(37,211,102,.05);color:var(--t)}

    .logo-link{position:fixed;top:24px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;font-family:var(--fh);font-size:19px;font-weight:800;color:var(--t);text-decoration:none;z-index:10}
    .ld{width:8px;height:8px;background:var(--a);border-radius:50%;animation:glowPulse 2s ease-in-out infinite}
  </style>
</head>
<body>
  <div class="hgrid"></div>
  <div class="hbg"></div>

  <a href="/" class="logo-link"><span class="ld"></span>Focobot</a>

  <div class="wrap">
    <div class="phone-mini">
      <div class="ph">
        <div class="sc2">
          <div class="ch4">
            <div class="av4">🤖</div>
            <div>
              <div class="cn4">Focobot</div>
              <div class="st4">online</div>
            </div>
          </div>
          <div class="cb4">
            <div class="mm rxm">Where did this page go? 😅</div>
            <div class="typ4"><div class="td4"></div><div class="td4"></div><div class="td4"></div></div>
            <div class="mm txm">Hmm, can't find that one!</div>
            <div class="mm txm txm2">Let me take you home 👇</div>
          </div>
        </div>
      </div>
    </div>

    <div class="big404">404</div>
    <h1 class="err-title">This page didn't reply in time.</h1>
    <p class="err-sub">Looks like this page ghosted you — just like that WhatsApp message your business sent at 2am before Focobot.</p>
    <div class="actions">
      <a href="/" class="bp">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Back to Homepage
      </a>
      <a href="/#pricing" class="bs">
        View Pricing
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>
    </div>
  </div>
</body>
</html>
