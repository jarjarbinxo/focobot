<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Focobot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #071f18;
      --accent: #25D366;
      --accent-glow: rgba(37,211,102,0.2);
      --text: #f0faf5;
      --text-muted: #9bbdae;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 24px;
      overflow: hidden;
      position: relative;
    }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-16px)} }
    @keyframes glow { 0%,100%{opacity:0.5} 50%{opacity:1} }
    @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    .bg-glow {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: 500px; height: 500px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      border-radius: 50%;
      animation: glow 4s ease-in-out infinite;
      pointer-events: none;
    }
    .orbit {
      position: absolute;
      top: 50%; left: 50%;
      width: 320px; height: 320px;
      margin: -160px 0 0 -160px;
      border: 1px dashed rgba(37,211,102,0.15);
      border-radius: 50%;
      animation: spin 20s linear infinite;
    }
    .orbit-dot {
      position: absolute;
      top: -5px; left: 50%;
      width: 10px; height: 10px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--accent);
      margin-left: -5px;
    }
    .content {
      position: relative;
      z-index: 1;
      animation: fadeUp 0.6s ease both;
    }
    .bot-emoji {
      font-size: 5rem;
      display: block;
      margin-bottom: 24px;
      animation: float 4s ease-in-out infinite;
    }
    .error-code {
      font-family: 'Syne', sans-serif;
      font-size: clamp(5rem, 15vw, 9rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent) 0%, #0a9f6e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      letter-spacing: -0.04em;
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 800;
      color: var(--text);
      margin-bottom: 16px;
    }
    p {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.65;
      max-width: 420px;
      margin: 0 auto 36px;
    }
    .ctas {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-home {
      background: var(--accent);
      color: #071f18;
      padding: 13px 28px;
      border-radius: 100px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .btn-home:hover {
      background: #1db954;
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(37,211,102,0.4);
    }
    .btn-wa {
      border: 1.5px solid rgba(37,211,102,0.3);
      color: var(--text);
      padding: 13px 28px;
      border-radius: 100px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .btn-wa:hover {
      border-color: var(--accent);
      background: rgba(37,211,102,0.07);
      transform: translateY(-2px);
    }
    .footer-note {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.8rem;
      color: rgba(155,189,174,0.4);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="orbit"><div class="orbit-dot"></div></div>
  <div class="content">
    <span class="bot-emoji">🤖</span>
    <div class="error-code">404</div>
    <h1>This Page Doesn't Exist</h1>
    <p>Looks like our bot couldn't find what you're looking for. Even Focobot has its limits — but it'll answer your WhatsApp in under 2 seconds.</p>
    <div class="ctas">
      <a href="/" class="btn-home">← Back to Homepage</a>
      <a href="https://wa.me/96500000000" class="btn-wa" target="_blank" rel="noopener">💬 Chat on WhatsApp</a>
    </div>
  </div>
  <div class="footer-note">© 2025 Focobot — WhatsApp Automation for Kuwait</div>
</body>
</html>
