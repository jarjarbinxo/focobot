<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Focobot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #071f18;
      --accent: #25D366;
      --text: #f0faf5;
      --muted: #8bbfa7;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-16px); }
    }
    .icon {
      font-size: 5rem;
      animation: float 4s ease-in-out infinite;
      display: block;
      margin-bottom: 28px;
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 800;
      color: #fff;
      margin-bottom: 12px;
    }
    p {
      font-size: 1.1rem;
      color: var(--muted);
      max-width: 400px;
      margin: 0 auto 36px;
      line-height: 1.6;
    }
    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: var(--bg);
      font-weight: 600;
      font-size: 1rem;
      padding: 14px 30px;
      border-radius: 12px;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 20px rgba(37,211,102,0.35);
    }
    a:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(37,211,102,0.55); }
  </style>
</head>
<body>
  <div>
    <span class="icon">💬</span>
    <h1>404</h1>
    <p>Looks like this page got lost in the chat. Let's get you back on track.</p>
    <a href="/">← Back to Focobot</a>
  </div>
</body>
</html>
