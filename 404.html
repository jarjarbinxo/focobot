<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'DM Sans',sans-serif;background:#071f18;color:#e8f5f0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100svh;padding:40px 5%;text-align:center;overflow:hidden;-webkit-font-smoothing:antialiased}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
@keyframes pulse-ring{0%{transform:scale(.85);opacity:.7}100%{transform:scale(1.7);opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes particle{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,-40px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

.particles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.p{position:absolute;border-radius:50%}
.p1{width:560px;height:560px;background:radial-gradient(circle,rgba(37,211,102,.11) 0%,transparent 65%);top:-130px;right:-80px;animation:particle 18s ease-in-out infinite}
.p2{width:380px;height:380px;background:radial-gradient(circle,rgba(10,79,60,.35) 0%,transparent 65%);bottom:-90px;left:-60px;animation:particle 14s ease-in-out infinite reverse}

.card{position:relative;z-index:1;max-width:560px;width:100%;animation:fadeUp .7s cubic-bezier(.22,1,.36,1) both}

.icon-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;width:96px;height:96px;background:rgba(37,211,102,.1);border:1.5px solid rgba(37,211,102,.22);border-radius:28px;margin:0 auto 32px;animation:float 5s ease-in-out infinite}
.icon-wrap::before,.icon-wrap::after{content:'';position:absolute;inset:-14px;border-radius:36px;border:1px solid rgba(37,211,102,.1);animation:pulse-ring 3s ease-out infinite}
.icon-wrap::after{animation-delay:1.5s}
.icon-wrap svg{width:44px;height:44px;fill:var(--accent,#25D366)}

.num{font-family:'Syne',sans-serif;font-size:clamp(5rem,18vw,9rem);font-weight:800;line-height:1;letter-spacing:-.05em;background:linear-gradient(135deg,#25D366,#0a4f3c 80%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px;animation:fadeUp .7s .05s cubic-bezier(.22,1,.36,1) both}

h1{font-family:'Syne',sans-serif;font-size:clamp(1.5rem,4vw,2.2rem);font-weight:700;color:#e8f5f0;letter-spacing:-.025em;line-height:1.2;margin-bottom:14px;animation:fadeUp .7s .12s cubic-bezier(.22,1,.36,1) both}

p{font-size:clamp(.95rem,2vw,1.05rem);color:#7dab97;max-width:420px;margin:0 auto 32px;line-height:1.65;animation:fadeUp .7s .18s cubic-bezier(.22,1,.36,1) both}

.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;animation:fadeUp .7s .25s cubic-bezier(.22,1,.36,1) both}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:'DM Sans',sans-serif;font-weight:600;border-radius:12px;cursor:pointer;transition:all .22s cubic-bezier(.22,1,.36,1);border:none;line-height:1;text-decoration:none;font-size:.95rem;padding:13px 26px}
.btn-primary{background:#25D366;color:#071f18;box-shadow:0 4px 20px rgba(37,211,102,.28)}
.btn-primary:hover{background:#2eef73;transform:translateY(-2px);box-shadow:0 8px 28px rgba(37,211,102,.38)}
.btn-ghost{background:rgba(37,211,102,.08);color:#e8f5f0;border:1px solid rgba(37,211,102,.2)}
.btn-ghost:hover{background:rgba(37,211,102,.14);border-color:rgba(37,211,102,.35);transform:translateY(-2px)}

.bubble-demo{margin-top:40px;animation:fadeUp .7s .35s cubic-bezier(.22,1,.36,1) both;opacity:.7}
.bubble{display:inline-flex;align-items:center;gap:10px;background:rgba(10,79,60,.35);border:1px solid rgba(37,211,102,.18);border-radius:14px;padding:12px 18px;font-size:.85rem;color:#7dab97;backdrop-filter:blur(8px)}
.bubble-dot{width:7px;height:7px;background:#25D366;border-radius:50%;animation:blink 1.4s ease-in-out infinite}
</style>
</head>

</html>
