<style>
:root{--bg:#071f18;--accent:#25D366;--txt:#fff;--txt2:rgba(255,255,255,.65)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;overflow:hidden;position:relative}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:translateY(0)}}
@keyframes glowOrb{0%,100%{opacity:.14;transform:scale(1)}50%{opacity:.25;transform:scale(1.1)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 24px rgba(37,211,102,.4)}50%{box-shadow:0 0 60px rgba(37,211,102,.8)}}
.orb{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;animation:glowOrb 7s ease-in-out infinite}
.orb1{width:500px;height:500px;background:rgba(37,211,102,.1);top:-15%;left:-10%}
.orb2{width:350px;height:350px;background:rgba(10,79,60,.5);bottom:-10%;right:-5%;animation-delay:-3s}
.emoji{font-size:5rem;animation:float 4s ease-in-out infinite;margin-bottom:24px}
.code{font-family:'Syne',sans-serif;font-size:clamp(6rem,16vw,12rem);font-weight:800;line-height:1;background:linear-gradient(135deg,#25D366,#34eb77);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:fadeUp .7s .1s both}
h1{font-family:'Syne',sans-serif;font-size:clamp(1.5rem,3vw,2.2rem);font-weight:700;margin:16px 0 14px;animation:fadeUp .7s .2s both}
p{font-size:1.05rem;color:var(--txt2);max-width:420px;line-height:1.65;margin-bottom:40px;animation:fadeUp .7s .3s both}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#071f18;font-family:'DM Sans',sans-serif;font-weight:700;font-size:.95rem;padding:14px 32px;border-radius:100px;text-decoration:none;transition:transform .2s,box-shadow .2s;animation:fadeUp .7s .4s both,pulseGlow 3s ease-in-out infinite}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(37,211,102,.6)}
.links{display:flex;gap:24px;margin-top:28px;animation:fadeUp .7s .5s both}
.links a{font-size:.88rem;color:var(--txt2);text-decoration:none;border-bottom:1px solid rgba(255,255,255,.15);padding-bottom:2px;transition:color .2s,border-color .2s}
.links a:hover{color:var(--txt);border-color:var(--accent)}
</style>
</head>
